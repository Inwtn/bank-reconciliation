# =============================================
# Banco de Dados - PostgreSQL
# =============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bank_reconciliation}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Upload de Arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Servidor
server.port=8080
server.servlet.context-path=/api

# Swagger
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.auth.admin-password=${APP_ADMIN_PASSWORD:}
app.auth.viewer-password=${APP_VIEWER_PASSWORD:}

# The health check is public; metrics require the admin account.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=bank-reconciliation

# Logging
logging.level.com.reconciliation=INFO
logging.level.org.springframework.web=INFO
